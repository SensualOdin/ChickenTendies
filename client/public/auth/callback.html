<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Signing you in...</title>
  <style>
    body { background: #1a1a2e; color: #fff; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    p { font-size: 1.1rem; opacity: 0.7; }
  </style>
</head>
<body>
  <p>Signing you in...</p>
  <script>
    // After OAuth, Supabase redirects here with either:
    // - Hash fragment: #access_token=...&refresh_token=... (implicit flow)
    // - Query params: ?code=... (PKCE flow)
    //
    // This physical file shadows the SPA route, so it must serve BOTH
    // audiences: with the native app installed, the deep link takes over
    // and the app completes sign-in; without it (desktop / plain mobile
    // browser) the deep link silently fails and we fall back to
    // /auth/web-callback — no physical file there, so the server serves
    // the SPA, whose AuthCallback route exchanges the code in the browser.
    var hash = window.location.hash || '';
    var search = window.location.search || '';
    window.location.replace('chickentinders://auth/callback' + search + hash);
    setTimeout(function () {
      // If the app opened, this page is hidden/frozen — don't steal the
      // flow back; only fall back while still visible.
      if (!document.hidden) {
        window.location.replace('/auth/web-callback' + search + hash);
      }
    }, 1200);
  </script>
</body>
</html>
