services:
  - type: web
    name: chickentinders
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: IS_PRODUCTION
        value: true
      - key: VITE_API_URL
        value: ""
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: YELP_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Full Firebase Admin service-account JSON contents (the file you
      # download from Firebase Console -> Project Settings -> Service
      # Accounts -> Generate new private key). Multi-line value is fine in
      # Render's UI. Without this, native push send is a no-op (web push
      # still works). See docs/FCM-SETUP.md.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
